<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 780" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <!-- ============ defs ============ -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#566573"/>
    </marker>
    <style>
      .layer   { fill:#ffffff; stroke:#34495E; stroke-width:1.5; rx:10; }
      .title   { fill:#1B2631; font-size:15px; font-weight:700; }
      .sub     { fill:#566573; font-size:11px; }
      .comp    { fill:#EAF2F8; stroke:#2E86C1; stroke-width:1.2; rx:8; }
      .comp-t  { fill:#1B4F72; font-size:12px; font-weight:600; }
      .comp-s  { fill:#566573; font-size:9.5px; }
      .accent  { fill:#FDEBD0; stroke:#CA6F1E; stroke-width:1.2; rx:8; }
      .accent-t{ fill:#7E5109; font-size:12px; font-weight:600; }
      .accent-s{ fill:#7E5109; font-size:9.5px; }
      .line    { stroke:#566573; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <!-- ============ background ============ -->
  <rect x="0" y="0" width="680" height="780" fill="#FBFCFC"/>

  <!-- ============ Layer 1: Browser ============ -->
  <text x="40" y="34" class="title">① 用户层 · Browser</text>
  <rect x="150" y="44" width="380" height="46" class="layer"/>
  <text x="340" y="68" text-anchor="middle" class="comp-t">Browser（5 个 Tab 视图）</text>
  <text x="340" y="84" text-anchor="middle" class="comp-s">求职 Agent · 岗位库 · 技能报表 · 简历匹配 · AI 面试</text>

  <!-- ============ Layer 2: Frontend ============ -->
  <text x="40" y="124" class="title">② 前端 · Native HTML/CSS/JS</text>
  <rect x="150" y="134" width="380" height="46" class="comp"/>
  <text x="340" y="158" text-anchor="middle" class="comp-t">单文件 index.html（内联 style/script）</text>
  <text x="340" y="174" text-anchor="middle" class="comp-s">Fetch API · SSE 流式 · 标签云 · 聊天气泡 · 响应式</text>

  <!-- arrow 1->2 -->
  <line x1="340" y1="90" x2="340" y2="132" class="line"/>

  <!-- ============ Layer 3: Backend ============ -->
  <text x="40" y="224" class="title">③ 后端 · FastAPI</text>
  <rect x="120" y="234" width="440" height="50" class="comp"/>
  <text x="340" y="258" text-anchor="middle" class="comp-t">FastAPI + Pydantic + uvicorn</text>
  <text x="340" y="275" text-anchor="middle" class="comp-s">9 个端点：/chat·/chat/stream·/jobs·/report·/match·/interview…</text>

  <!-- arrow 2->3 -->
  <line x1="340" y1="180" x2="340" y2="232" class="line"/>

  <!-- ============ Layer 4: AI Intelligence (3 boxes) ============ -->
  <text x="40" y="324" class="title">④ AI 智能层</text>

  <!-- LangGraph -->
  <rect x="20" y="334" width="200" height="92" class="accent"/>
  <text x="120" y="356" text-anchor="middle" class="accent-t">LangGraph Agent</text>
  <text x="120" y="373" text-anchor="middle" class="accent-s">5 节点 DAG</text>
  <text x="120" y="388" text-anchor="middle" class="accent-s">parse→retrieve→filter</text>
  <text x="120" y="403" text-anchor="middle" class="accent-s">→reflect→summarize</text>
  <text x="120" y="418" text-anchor="middle" class="accent-s">反思循环 ≤3 轮</text>

  <!-- MCP -->
  <rect x="240" y="334" width="200" height="92" class="comp"/>
  <text x="340" y="356" text-anchor="middle" class="comp-t">MCP Server</text>
  <text x="340" y="373" text-anchor="middle" class="comp-s">FastMCP · stdio</text>
  <text x="340" y="388" text-anchor="middle" class="comp-s">3 Tools:</text>
  <text x="340" y="403" text-anchor="middle" class="comp-s">search_jobs / query_rag</text>
  <text x="340" y="418" text-anchor="middle" class="comp-s">/ get_skill_gap</text>

  <!-- RAG -->
  <rect x="460" y="334" width="200" height="92" class="comp"/>
  <text x="560" y="356" text-anchor="middle" class="comp-t">RAG 检索</text>
  <text x="560" y="373" text-anchor="middle" class="comp-s">bge-m3 (HuggingFace)</text>
  <text x="560" y="388" text-anchor="middle" class="comp-s">本地 1024 维 Embedding</text>
  <text x="560" y="403" text-anchor="middle" class="comp-s">FAISS 向量库</text>
  <text x="560" y="418" text-anchor="middle" class="comp-s">余弦 + 硬过滤 + 软排序</text>

  <!-- arrow 3->4 (3 lines) -->
  <line x1="240" y1="284" x2="120" y2="332" class="line"/>
  <line x1="340" y1="284" x2="340" y2="332" class="line"/>
  <line x1="440" y1="284" x2="560" y2="332" class="line"/>

  <!-- ============ Layer 5: LLM ============ -->
  <text x="40" y="464" class="title">⑤ LLM 决策中枢</text>
  <rect x="120" y="474" width="440" height="46" class="comp"/>
  <text x="340" y="498" text-anchor="middle" class="comp-t">DeepSeek（deepseek-chat）</text>
  <text x="340" y="514" text-anchor="middle" class="comp-s">经 ChatOpenAI（OpenAI 兼容）调用 · 不绑定厂商 · 单查 2~4 次小调用</text>

  <!-- arrows 4->5 -->
  <line x1="120" y1="426" x2="240" y2="472" class="line"/>
  <line x1="340" y1="426" x2="340" y2="472" class="line"/>
  <line x1="560" y1="426" x2="440" y2="472" class="line"/>

  <!-- ============ Layer 6: Data Collection ============ -->
  <text x="40" y="564" class="title">⑥ 数据采集 · 反爬</text>
  <rect x="120" y="574" width="440" height="46" class="comp"/>
  <text x="340" y="598" text-anchor="middle" class="comp-t">Playwright + playwright-stealth</text>
  <text x="340" y="614" text-anchor="middle" class="comp-s">CDP 接管真实 Chrome 绕 Boss 反爬 · 多源插件 BaseSource</text>

  <!-- arrow 5->6 -->
  <line x1="340" y1="520" x2="340" y2="572" class="line"/>

  <!-- ============ Layer 7: Storage ============ -->
  <text x="40" y="664" class="title">⑦ 存储</text>
  <rect x="120" y="674" width="440" height="46" class="comp"/>
  <text x="340" y="698" text-anchor="middle" class="comp-t">MySQL + FAISS Index</text>
  <text x="340" y="714" text-anchor="middle" class="comp-s">final_results（岗位）· agent_runs（Bad Case）· bge-m3 权重缓存</text>

  <!-- arrow 6->7 -->
  <line x1="340" y1="620" x2="340" y2="672" class="line"/>

  <!-- ============ side note ============ -->
  <text x="40" y="752" class="sub">数据流向：①②③ 用户交互 → ④ AI 智能编排 → ⑤ LLM 决策 → ⑥ 采集 → ⑦ 落库；Bad Case 闭环回流重跑</text>
</svg>
