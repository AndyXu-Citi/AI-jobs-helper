<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 求职 Agent — API</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, "PingFang SC", sans-serif;
           margin: 0; min-height: 100vh; display: flex; align-items: center;
           justify-content: center; font-size: 15px; color: #1f2937; background: #f8fafc; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
            padding: 32px 40px; max-width: 560px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    h1 { font-size: 18px; margin: 0 0 12px; }
    code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; }
    a { color: #2563eb; }
    ul { padding-left: 18px; line-height: 1.9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🤖 AI 求职 Agent — 后端 API 运行中</h1>
    <p>前端界面请通过 Vite 开发服务器访问：</p>
    <ul>
      <li><code>cd frontend &amp;&amp; npm run dev</code> → 打开 <a href="http://localhost:5173">http://localhost:5173</a></li>
      <li>API 文档（Swagger）：<a href="/docs">/docs</a></li>
      <li>健康检查：<a href="/api/health">/api/health</a>（若已启用）</li>
    </ul>
    <p style="color:#6b7280;font-size:13px;margin-top:16px;">
      本服务仅提供 HTTP API，不内置前端静态资源。
    </p>
  </div>

</html>
